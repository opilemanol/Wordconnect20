name: Build Signed Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android123' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-keywc.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Prepare Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          elif [ -f "${{ github.workspace }}/my-upload-keywc.jks" ]; then
            echo "Using existing keystore in repository root."
          else
            echo "Generating fallback keystore if none provided"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=WordConnect, O=GameDevelopment, C=US"
          fi

      - name: Build Signed Release AAB
        run: gradle bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
