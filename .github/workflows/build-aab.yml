name: Build Signed Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-keywc.jks
      LEGACY_KEYSTORE_PATH: ${{ github.workspace }}/my-upload-leywc.jks
      KEY_ALIAS: upload
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Verify release keystore
        shell: bash
        run: |
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Using keystore: $KEYSTORE_PATH"
          elif [ -f "$LEGACY_KEYSTORE_PATH" ]; then
            export KEYSTORE_PATH="$LEGACY_KEYSTORE_PATH"
            echo "Using legacy keystore: $KEYSTORE_PATH"
          else
            echo "Keystore not found at $KEYSTORE_PATH or $LEGACY_KEYSTORE_PATH" >&2
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "STORE_PASSWORD and KEY_PASSWORD must be set as GitHub repository secrets." >&2
            exit 1
          fi

          ls -l "$KEYSTORE_PATH"

      - name: Build Signed Release AAB
        run: gradle bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: save-this-keystore
          path: ${{ env.KEYSTORE_PATH }}
